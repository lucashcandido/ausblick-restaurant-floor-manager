<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salón">
<title>Ausblick – Salón</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Ausblick – floor manager for restaurants: tables, reservations, time at the table, orders and statistics.
   Built like ausblick-clientes / ausblick-shiftmanager: one index.html on GitHub Pages, the data in a private repository
   (salon.json), the token published encrypted (access.json) and opened with a 12-character code. */
:root{--bg:#f6f6f6;--card:#fff;--text:#111;--muted:#6f6f6f;--line:#e3e3e3;--accent:#111;--accent-soft:#ececec;--on-accent:#fff;--in:#15803d;--in-soft:#dcf5e4;--out:#c62828;--out-soft:#fde4e4;--warn:#b45309;--warn-soft:#fdeed3;--blue:#1d4ed8;--blue-soft:#e3ebff;--vio:#4a5568;--vio-soft:#e9ecf1;--grey:#6b7280;--grey-soft:#eceef1}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0b;--card:#161616;--text:#f2f2f2;--muted:#a3a3a3;--line:#2a2a2a;--accent:#f2f2f2;--accent-soft:#262626;--on-accent:#111;--in:#4ade80;--in-soft:#12301f;--out:#f87171;--out-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#3a2a0d;--blue:#7ea2ff;--blue-soft:#1b2648;--vio:#c3cad6;--vio-soft:#23272e;--grey:#9ca3af;--grey-soft:#24262a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
main{max-width:1232px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.logo{width:44px;height:44px;border-radius:12px;background:#111;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.logo img{width:30px;height:auto;display:block;margin-top:2px}
.brand{display:block;font-size:11px;font-weight:400;letter-spacing:.32em;color:var(--muted);margin-bottom:1px}
.top h1{font-size:20px;margin:0;line-height:1.15;min-width:0;flex:1}
.top .sub{display:block;font-size:14px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.icon.add{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.top select{max-width:180px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border-radius:14px;padding:0 20px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.go{background:var(--in);color:#fff;border-color:var(--in)}
.btn.danger{color:var(--out);border-color:var(--out);background:var(--card)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;font-size:15px;padding:0 12px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.msg.err{background:var(--out-soft);color:var(--out)} .msg.ok{background:var(--in-soft);color:var(--in)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.field{margin-bottom:14px} .field label,.lbl{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
.field input,.field textarea,.field select,.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus,.search:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media (max-width:520px){.grid2.wrap{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.tabs button,.seg button{border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer;padding:8px 10px;font-size:15px}
.tabs button.on,.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px} .seg button{border-radius:999px;padding:6px 12px;font-size:14px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:24px;letter-spacing:.06em;text-align:center;padding:12px;border:2px dashed var(--accent);border-radius:12px;margin:8px 0 12px;user-select:all}
.empty{color:var(--muted);padding:14px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)} .pill.err,.pill.wait{cursor:pointer;text-decoration:underline dotted}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--in)} .pill.wait i{background:var(--warn)} .pill.err i{background:var(--out)} .pill.demo i{background:var(--blue)}
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.sheet.wide{max-width:720px}
.sheet h3{margin:0 0 14px;font-size:20px}
.sheet h4{margin:16px 0 8px;font-size:16px}
.row2{display:flex;gap:10px;flex-wrap:wrap} .row2 .btn{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:16px}
.toast button{background:none;border:0;color:#fff;text-decoration:underline;font-weight:700;cursor:pointer;font-size:16px}
.hub{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.hub button{border:0;border-radius:10px;background:none;font-weight:750;font-size:16px;padding:10px 4px;cursor:pointer;color:var(--muted)}
.hub button.on{background:var(--accent);color:var(--on-accent)}
.hub .n{font-weight:600;margin-left:6px;opacity:.8}
@media (max-width:520px){.hub button{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 2px} .hub .n{margin-left:3px} .floor{min-width:620px}}
#setup{max-width:728px;margin:0 auto}
.lang{display:flex;gap:4px;flex:none}
.lang button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lang.big{margin-bottom:6px} .lang.big button{flex:1;padding:10px;font-size:15px}
.req{color:var(--out)}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;cursor:pointer;margin:4px 0 12px} .chk input{width:22px;height:22px;margin:0;accent-color:var(--accent)}

/* ---------- floor ---------- */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fbar .sp{flex:1}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:650;white-space:nowrap}
.kpi b{font-weight:800}
.alerts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.al{flex:none;border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.al.out{background:var(--out-soft);color:var(--out)} .al.warn{background:var(--warn-soft);color:var(--warn)} .al.blue{background:var(--blue-soft);color:var(--blue)}
.ftabs{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:0 10px;scrollbar-width:none;position:relative;z-index:1;margin-bottom:-1px}
.ftab{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:12px 12px 0 0;background:var(--bg);color:var(--muted);font-weight:750;font-size:15px;padding:8px 14px;cursor:pointer;max-width:240px;white-space:nowrap;user-select:none;-webkit-user-select:none}
.ftab:hover{color:var(--text)}
.ftab.on{background:var(--card);color:var(--text);border-bottom-color:var(--card);padding-top:10px}
.ftab .fn{overflow:hidden;text-overflow:ellipsis}
.ftab .n{font-size:12px;font-weight:750;color:var(--muted);background:var(--accent-soft);border-radius:999px;padding:0 7px}
.ftab .n.free{background:var(--in-soft);color:var(--in)}
.ftab .dot{width:8px;height:8px;border-radius:50%;background:var(--out);flex:none}
.ftab .ed{font-size:13px;opacity:.7;margin-left:-2px}
.ftab.add{padding:6px 12px;font-size:20px;line-height:1.1;font-weight:600}
.floorwrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);-webkit-overflow-scrolling:touch}
.floor{position:relative;width:100%;min-width:700px;aspect-ratio:1000/640;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:2% 3.125%;user-select:none;-webkit-user-select:none}
.floor.edit,.floor.join{touch-action:none}
.tb{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;border:2px solid;cursor:pointer;text-align:center;line-height:1.15;padding:2px;overflow:hidden;font-weight:800;font-size:16px;-webkit-touch-callout:none}
.tb.round{border-radius:50%}
.tb small{display:block;font-weight:650;font-size:12.5px;white-space:nowrap}
.tb small.big{font-size:14px;font-weight:800}
.st-free{background:var(--in-soft);border-color:var(--in);color:var(--in)}
.st-res{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.st-eat{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.st-bill{background:var(--out-soft);border-color:var(--out);color:var(--out)}
.st-clean{background:var(--grey-soft);border-color:var(--grey);color:var(--grey);border-style:dashed}
.tb.over{box-shadow:0 0 0 3px var(--out);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--out) 35%,transparent)}}
@media (prefers-reduced-motion: reduce){.tb.over{animation:none}}
.tb .ov-t{color:var(--out)}
.jbox{position:absolute;border:2px dashed var(--muted);border-radius:18px;pointer-events:none}
.jlab{position:absolute;top:-11px;left:12px;background:var(--card);padding:0 6px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.floor.edit .tb{background:var(--card);border-color:var(--text);border-style:solid;color:var(--text);cursor:move;box-shadow:none;animation:none}
.floor.edit .tb.sel{outline:3px solid var(--blue);outline-offset:2px}
.rz{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:6px 0 12px 0;background:var(--blue);cursor:nwse-resize;touch-action:none}
.floor.join .tb{opacity:.75} .floor.join .tb.pick{opacity:1;outline:3px solid var(--blue);outline-offset:2px}
.mq{position:absolute;border:2px dashed var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:6px;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:14px;height:14px;border-radius:4px;border:2px solid}
.ebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:10px;border:1px solid var(--blue);background:var(--blue-soft);border-radius:14px}
.ebar b{color:var(--blue);margin-right:auto}
.ebar .btn{min-height:42px;font-size:15px;padding:0 14px}
.epanel{margin-top:10px}
.shapes{display:flex;gap:6px;flex-wrap:wrap}
.shp{display:inline-block;width:18px;height:14px;border:2px solid currentColor;border-radius:3px;vertical-align:-2px;margin-right:6px}
.shp.round{width:15px;height:15px;border-radius:50%} .shp.sq{width:15px;height:15px} .shp.rect{width:24px}

/* ---------- table sheet, orders ---------- */
.thead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.thead h3{margin:0;flex:1}
.thead h3 small{display:block;font-size:15px;color:var(--muted);font-weight:600;margin-top:2px}
.stb{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap;border:1.5px solid}
.tinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tinfo div{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted);font-weight:600}
.tinfo b{display:block;color:var(--text);font-size:18px}
.tinfo .late b{color:var(--out)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;font-weight:650;font-size:15px;margin-bottom:12px}
.olist{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:4px}
.olist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:16px}
.olist .q{font-weight:800;min-width:30px}
.olist .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.olist .nm small{display:block;color:var(--muted);font-size:13px}
.olist .pr{font-weight:700;white-space:nowrap}
.olist button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer;font-weight:800;flex:none}
.os{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.os0{background:var(--warn-soft);color:var(--warn)} .os1{background:var(--blue-soft);color:var(--blue)} .os2{background:var(--in-soft);color:var(--in)}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:8px 0}
.split{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-bottom:8px}
.split input{width:64px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:center}
.split b{color:var(--text)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.menu button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.25}
.menu button:hover{border-color:var(--accent)}
.menu button small{display:block;color:var(--muted);font-weight:600}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:20px;cursor:pointer}
.step b{min-width:34px;text-align:center;font-size:20px}
.ulist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ulist li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ulist li:hover{border-color:var(--accent)}
.ulist li.best{border:2px solid var(--blue)}
.ulist li.off{opacity:.5;cursor:default}
.ulist li b{min-width:60px} .ulist li span{flex:1;color:var(--muted);font-size:14px} .ulist li span.tag{flex:none;font-size:12px}

/* ---------- reservations ---------- */
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dnav .day{font-weight:800;font-size:18px;min-width:150px;text-align:center}
.dnav .sp{flex:1}
.sec{margin:16px 0 8px;font-size:15px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ri{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ri:hover{border-color:var(--accent)}
.ri .tm{font-weight:800;font-size:18px;min-width:52px}
.ri .bd{flex:1;min-width:0}
.ri .nm{font-weight:750;font-size:17px;overflow-wrap:anywhere}
.ri .mt{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:14px;color:var(--muted)}
.ri .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ri.done{opacity:.55}
.tag{font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--vio-soft);color:var(--vio)}
.tag.big{background:var(--warn-soft);color:var(--warn)} .tag.alg{background:var(--out-soft);color:var(--out)} .tag.tt{background:var(--blue-soft);color:var(--blue)} .tag.ok{background:var(--in-soft);color:var(--in)}
@media (max-width:620px){.ri{flex-wrap:wrap} .ri .acts{width:100%;justify-content:flex-start}}

/* ---------- orders view ---------- */
.ocols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.oc h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;font-size:17px} .oc h4 span{margin-left:auto;font-size:14px;color:var(--muted)}
.oc .olist li{font-size:15px}

/* ---------- statistics ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-weight:650;font-size:14px}
.tile b{display:block;font-size:clamp(19px,2.1vw,26px);white-space:nowrap;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tile i{display:block;font-style:normal;color:var(--muted);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.box h4{margin:0 0 10px;font-size:17px}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat div{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.heat i{display:block;height:44px;border-radius:8px;margin-bottom:4px;border:1px solid var(--line)}
.scale{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px}
.scale i{width:22px;height:12px;border-radius:4px;border:1px solid var(--line)}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bars li{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:10px;align-items:center;font-size:15px}
.bars .b{height:12px;border-radius:6px;background:var(--accent)}
.bars .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:15px}
table.cmp th,table.cmp td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.cmp th{color:var(--muted);font-size:13px}
table.cmp td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:760px){.two{grid-template-columns:1fr}}

/* ---------- settings lists ---------- */
.mlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.mlist li{display:flex;gap:6px;align-items:center}
.mlist input,.mlist select{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:15px;min-width:0}
.mlist input.n{flex:1} .mlist input.p{width:100px}
.mlist button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none;font-weight:800}

<body>
<main>
  <!-- set-up (once per device) -->
  <section id="setup" hidden>
    <div class="top"><div class="logo"><img src="logo-mark-96.png" alt="Ausblick"></div><h1><span class="brand">AUSBLICK</span><span data-t="title"></span><span class="sub" data-t="setup_sub"></span></h1><div class="lang" id="langTop"></div></div>
    <div class="card">
      <div class="tabs"><button type="button" data-mode="code" class="on" data-t="tab_code"></button><button type="button" data-mode="token" data-t="tab_token"></button></div>
      <div class="field"><label for="sName" data-t="name"></label><input id="sName" autocomplete="given-name" placeholder="Lucas"><p class="hint" data-t="name_hint"></p></div>
      <div id="mCode">
        <div class="field"><label for="sCode" data-t="code"></label><input id="sCode" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"><p class="hint" data-t="code_hint"></p></div>
      </div>
      <div id="mToken" hidden>
        <div class="field"><label for="sToken" data-t="token"></label><input id="sToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"><p class="hint" data-th="token_hint"></p></div>
        <div class="field"><label for="sRepo" data-t="repo"></label><input id="sRepo" autocomplete="off" spellcheck="false"></div>
      </div>
      <button class="btn primary wide" id="sGo" type="button" data-t="go"></button>
      <button class="btn wide" id="sDemo" type="button" style="margin-top:10px" data-t="demo_btn"></button>
      <button class="btn wide" id="sBack" type="button" hidden style="margin-top:10px" data-t="back"></button>
      <div id="sMsg"></div>
      <p class="hint" data-t="demo_hint"></p>
    </div>
  </section>

  <section id="app" hidden>
    <div class="top">
      <div class="logo"><img src="logo-mark-96.png" alt="Ausblick"></div>
      <h1><span class="brand">AUSBLICK</span><span id="hTitle"></span><span class="sub"><span id="clock"></span> · <span class="pill" id="sync"><i></i><span>—</span></span></span></h1>
      <select id="locSel" hidden data-ta="loc"></select>
      <button class="icon add" id="add" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" id="gear" type="button" data-ta="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="hub" id="hub"></div>
    <div id="vFloor"></div>
    <div id="vRes" hidden></div>
    <div id="vOrd" hidden></div>
    <div id="vStats" hidden></div>
  </section>
</main>

/* ---------- small helpers ---------- */
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
var pad = function(n){ return (n < 10 ? '0' : '') + n; };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
var iso = function(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); };
var todayIso = function(){ return iso(new Date()); };
var addDays = function(d, n){ var p = d.split('-'), x = new Date(+p[0], +p[1] - 1, +p[2] + n, 12); return iso(x); };
var hm = function(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
var at = function(d, time){ var p = d.split('-'), q = String(time || '00:00').split(':'); return new Date(+p[0], +p[1] - 1, +p[2], +q[0] || 0, +q[1] || 0).getTime(); };
var MIN = 60000;
var dur = function(min){ min = Math.max(0, Math.round(min)); return min < 60 ? min + 'm' : Math.floor(min / 60) + 'h ' + pad(min % 60) + 'm'; };
var dayText = function(d){
  if(d === todayIso()) return t('today'); if(d === addDays(todayIso(), 1)) return t('tomorrow'); if(d === addDays(todayIso(), -1)) return t('yesterday');
  var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12).toLocaleDateString(t('locale'), { weekday: 'short', day: 'numeric', month: 'short' });
};
var dayLong = function(d){ var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12).toLocaleDateString(t('locale'), { weekday: 'long', day: 'numeric', month: 'long' }); };
var digits = function(v){ return String(v || '').replace(/\D/g, ''); };
var waNum = function(v){ var d = digits(v); if(d.length < 8) return ''; if(String(v).trim().charAt(0) !== '+' && d.indexOf('54') !== 0) d = '549' + d.replace(/^0/, ''); return d; };
var norm = function(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
var natural = function(a, b){ return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); };
var copy = function(x){ return JSON.parse(JSON.stringify(x)); };
var num = function(v, d){ var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
var money = function(n){ return (S().cur || '$') + ' ' + Math.round(n || 0).toLocaleString(t('locale')); };

/* ---------- state ----------
   data: id -> record with kind k:
   set  settings (id 'set')     loc  location: n, o
   tbl  table: loc, n, sh (round/sq/rect), x, y, w, h (floor = 1000 × 640), min, max, j (join id; same j = joined)
   flr  floor of a location (tab above the plan): loc, n, o; a table's fl says which floor it is on (none = the first)
   menu dish: n, p (price), cat (ent/pri/pos/beb), o
   res  booking or waitlist: loc, d, a (HH:MM), n, p, tel, src (tel/walk/web), tb (table id), dep, alg, note, tags[], st ('' / seated / noshow / cancel / wait), at (waitlist since), nt (notified), v (visit)

   Every record has t (last change; newer wins) and del: true when deleted. */

function S(){ var s = data.set && !data.set.del ? data.set : {}; var o = {}; Object.keys(DEF).forEach(function(k){ o[k] = s[k] == null ? DEF[k] : s[k]; }); return o; }
var live = function(k){ return Object.keys(data).map(function(id){ return data[id]; }).filter(function(x){ return x && x.k === k && !x.del; }); };
var here = function(k){ return live(k).filter(function(x){ return (x.loc || 'main') === curLoc; }); };

var cleanCode = function(c){ return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };

var b64bytes = function(s){ var x = atob(String(s)), b = new Uint8Array(x.length); for(var i = 0; i < x.length; i++) b[i] = x.charCodeAt(i); return b; };

var b64e = function(s){ return bytesb64(new TextEncoder().encode(s)); };

function rangeStart(r){ var d = new Date(); d.setHours(0, 0, 0, 0); if(r === 'week') d.setDate(d.getDate() - 6); if(r === 'month') d.setDate(d.getDate() - 29); return d.getTime(); }
function statsFor(loc, r){
  var from = rangeStart(r), now = Date.now();
  var vs = live('visit').filter(function(v){ return (v.loc || 'main') === loc && v.a >= from; });
  var ntab = live('tbl').filter(function(x){ return (x.loc || 'main') === loc; }).length || 1;
  var rev = 0, covers = 0, durs = [], dish = {}, staff = {}, hours = new Array(24).fill(0), days = {};
  vs.forEach(function(v){
    var tot = v.end ? (v.tot != null ? v.tot : visitTotal(v)) : visitTotal(v); rev += tot; covers += +v.p || 0;
    if(v.end) durs.push((v.end - v.a) / MIN);
    items(v).forEach(function(i){ var k = i.n; dish[k] = dish[k] || { n: i.n, q: 0, r: 0 }; dish[k].q += +i.q || 1; dish[k].r += (+i.p || 0) * (+i.q || 1); });
    var who = v.by || '—'; staff[who] = staff[who] || { n: who, r: 0, c: 0 }; staff[who].r += tot; staff[who].c++;
    days[iso(new Date(v.a))] = 1;
    var a = v.a, e = v.end || now, nt = (v.tb || []).length || 1;
    for(var m = a; m < e; ){ var d = new Date(m), h = d.getHours(), next = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h + 1).getTime(); hours[h] += (Math.min(e, next) - m) / MIN * nt; m = next; }
  });

  var peak = occ.reduce(function(b, x, i){ return x > occ[b] ? i : b; }, 0);
  return { vs: vs, rev: rev, covers: covers, turns: vs.length, avgT: vs.length ? rev / vs.length : 0, avgP: covers ? rev / covers : 0, dur: durs.length ? durs.reduce(function(s, x){ return s + x; }, 0) / durs.length : 0,
    dish: Object.keys(dish).map(function(k){ return dish[k]; }).sort(function(a, b){ return b.q - a.q; }), staff: Object.keys(staff).map(function(k){ return staff[k]; }).sort(function(a, b){ return b.r - a.r; }),

/* ---------- small windows ----------
   A window that edits something saves when it is closed (tap next to it, Escape or Done). el._save returning false keeps it open. [data-discard] closes without saving. */
function modal(html, init){
  var ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  var down = null;
  ov.addEventListener('pointerdown', function(e){ down = e.target; });
  ov.addEventListener('click', function(e){
    if(e.target.closest('[data-discard]')){ close(ov); return; }
    if((e.target === ov && down === ov) || e.target.closest('[data-close]')) tryClose(ov);
  });
  $('#layer').appendChild(ov); if(init) init(ov); return ov;
}
function tryClose(ov){ if(!ov || !ov.parentNode) return; if(ov._save){ var a = document.activeElement; if(a && a.blur && ov.contains(a)) a.blur(); if(ov._save() === false) return; } close(ov); }
function close(el){ if(el && el.parentNode) el.parentNode.removeChild(el); }
function closeAll(){ $('#layer').innerHTML = ''; liveSheet = null; }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ var o = $('#layer .ov:last-child'); if(o) tryClose(o); } });
var toastT = 0;
function toast(text, act, fn){
  var old = $('.toast'); if(old) close(old);
  var el = document.createElement('div'); el.className = 'toast'; el.innerHTML = '<span>' + esc(text) + '</span>' + (act ? '<button type="button">' + esc(act) + '</button>' : '');
  if(act) el.querySelector('button').onclick = function(){ close(el); fn(); };
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(function(){ close(el); }, 6000);
}

/* ---------- saving to GitHub ----------
   salon.json = {v:1, c:{id → record}}. Saving re-reads the file, merges (newer change wins per record; order lines of a table are merged one by one) and writes. */
function setSync(st, k, arg){ sync.label = [st, k, arg]; var p = $('#sync'); p.className = 'pill ' + st; p.lastChild.textContent = k === '…' ? '…' : t(k, arg); }
$('#sync').addEventListener('click', function(){
  if(!sync.err || !/err|wait/.test(this.className)) return;
  modal('<h3>' + esc(t('err_title')) + '</h3><p style="overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;font-size:14px">' + esc(sync.err.detail) + '</p>' + (/^PUT 403/.test(sync.err.detail) ? '<div class="msg warn">' + esc(t('err_write')) + '</div>' : '') + '<p class="hint">' + esc(new Date(sync.err.at).toLocaleString(t('locale'))) + ' · ' + esc(cfg.repo) + '</p><div class="row2"><button class="btn" data-close type="button">' + esc(t('close')) + '</button><button class="btn primary" id="errRetry" type="button">' + esc(t('err_retry')) + '</button></div>', function(el){ $('#errRetry', el).onclick = function(){ close(el); syncNow(); }; });
});
function syncSoon(){ if(!cfg || cfg.demo) return; clearTimeout(sync.timer); setSync('wait', 's_saving'); sync.timer = setTimeout(syncNow, 1200); }
function api(opt){
  opt = opt || {}; opt.headers = Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, opt.headers || {}); opt.cache = 'no-store';
  return fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + APP.file, opt);
}
function merge(remote){
  var changed = false;
  Object.keys(remote || {}).forEach(function(id){
    var r = remote[id], l = data[id];
    if(!r) return;
    if(!l){ data[id] = r; changed = true; return; }
    var win = (r.t || 0) > (l.t || 0) ? copy(r) : l;
    if(win !== l) changed = true;
    if(l.it || r.it){   /* order lines from two devices are all kept, newer change per line wins */
      var it = {}, a = l.it || {}, b = r.it || {}, diff = false;
      Object.keys(a).concat(Object.keys(b)).forEach(function(k){ var x = a[k], y = b[k]; it[k] = !x ? y : !y ? x : (y.t || 0) > (x.t || 0) ? y : x; if(it[k] !== a[k]) diff = true; });
      if(diff || win !== l){ win.it = it; changed = true; }
    }
    data[id] = win;
  });
  return changed;
}
async function httpErr(r, what){
  var m = ''; try{ var j = await r.clone().json(); m = j.message || ''; }catch(e){ try{ m = (await r.text()).slice(0, 200); }catch(x){} }
  var e = new Error('http ' + r.status); e.status = r.status; e.detail = what + ' ' + r.status + (m ? ': ' + m : ''); return e;
}
async function load(){
  var r = await api();
  if(r.status === 404) return { sha: null, c: {} };
  if(!r.ok) throw await httpErr(r, 'GET');
  var j = await r.json(), txt = j.content ? b64d(j.content) : '';
  if(!txt && j.size){ var rr = await api({ headers: { Accept: 'application/vnd.github.raw' } }); if(!rr.ok) throw await httpErr(rr, 'GET raw'); txt = await rr.text(); }
  var o = JSON.parse(txt || '{}');
  return { sha: j.sha, c: o.c || {} };
}
async function save(){
  for(var tries = 0; tries < 3; tries++){
    var cur = await load(); merge(cur.c);
    var body = { message: cfg.name + ' ' + new Date().toISOString(), content: b64e(JSON.stringify({ v: 1, c: data }) + '\n') };
    if(cur.sha) body.sha = cur.sha;
    var r = await api({ method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if(r.ok) return;
    if(r.status !== 409 && r.status !== 422) throw await httpErr(r, 'PUT');
    sync.lastConflict = await httpErr(r, 'PUT');
  }
  throw sync.lastConflict;
}
async function syncNow(){
  if(!cfg || cfg.demo) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true; clearTimeout(sync.timer);
  try{
    if(dirty){ dirty = false; store.set(KEY.dirty, dirty); try{ await save(); }catch(e){ dirty = true; store.set(KEY.dirty, dirty); throw e; } }
    else { var cur = await load(); merge(cur.c); }
    store.set(DATA_KEY, data);
    sync.err = null; setSync('ok', 's_saved', hm(Date.now()));
  }catch(e){
    if(/http 401/.test(e.message)){
      var fresh = null; try{ fresh = await openAccess(cfg.code); }catch(x){}
      if(fresh && fresh.token !== cfg.token){ cfg.token = fresh.token; cfg.repo = fresh.repo; store.set(KEY.cfg, cfg); sync.busy = false; return syncNow(); }
      setSync('err', 's_expired');
    } else {
      sync.err = { at: Date.now(), detail: e.detail || (e.name + ': ' + e.message) };
      try{ console.error('[ausblick sync]', sync.err.detail); }catch(x){}
      if(e.status) setSync(dirty ? 'wait' : 'err', dirty ? 's_later_err' : 's_error', e.status);
      else setSync(dirty ? 'wait' : 'err', dirty ? 's_later' : 's_offline');
    }
  }
  sync.busy = false; render();
  if(sync.again){ sync.again = false; syncNow(); }
}
/* live sync every 20 s while open (a floor changes fast); timers on the floor every 30 s */
setInterval(function(){ if(cfg && !cfg.demo && document.visibilityState === 'visible') syncNow(); }, 20000);
setInterval(function(){ if(cfg && document.visibilityState === 'visible' && !$('#layer .ov') && !drag.on && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); else if(liveSheet && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) liveSheet(); }, 30000);

applyLang();
